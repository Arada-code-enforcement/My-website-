<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Beautiful Website</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    color: #333;
}

/* Navbar */
nav {
    display: flex;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    padding: 15px;
    position: sticky;
    top: 0;
}

nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: yellow;
}

/* Hero Section */
.hero {
    text-align: center;
    padding: 100px 20px;
    color: white;
}

.hero h1 {
    font-size: 40px;
}

.hero button {
    padding: 12px 20px;
    border: none;
    background: #ff9800;
    color: white;
    cursor: pointer;
}

/* Cards */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

/* Contact */
.contact {
    text-align: center;
    padding: 40px;
    background: white;
}

input, textarea {
    width: 80%;
    padding: 10px;
    margin: 10px;
}

button {
    padding: 10px 20px;
    background: green;
    color: white;
    border: none;
}

/* Footer */
footer {
    background: black;
    color: white;
    text-align: center;
    padding: 10px;
}
</style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
</nav>

<section class="hero">
    <h1>Welcome to My Website</h1>
    <p>Modern and Beautiful Design</p>
    <button onclick="alert('Welcome!')">Get Started</button>
</section>

<section id="services" class="container">
    <div class="card">
        <h3>Web Design</h3>
        <p>I create beautiful websites.</p>
    </div>
    <div class="card">
        <h3>Development</h3>
        <p>Fast and responsive websites.</p>
    </div>
    <div class="card">
        <h3>Support</h3>
        <p>I help fix problems.</p>
    </div>
</section>

<section id="contact" class="contact">
    <h2>Contact Me</h2>
    <input type="text" placeholder="Your Name"><br>
    <input type="email" placeholder="Your Email"><br>
    <textarea placeholder="Your Message"></textarea><br>
    <button>Send</button>
</section>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
